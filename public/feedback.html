<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSG Bunker Feedback - Automated Course &amp; Faculty Feedback | PSG Tech</title>
    <meta name="google-site-verification" content="NGyoxybNQ87eTpl7xo17mY4BGTy3kcssC108SPkqIHM" />
    <meta name="google-site-verification" content="fqjH3u3WyqHU7SbHQ2_QrZvSlVzNipnwz1bB1HAtemI" />
    <meta name="description" content="PSG Bunker Automated Feedback: Quickly complete semester course and faculty feedback forms for PSG College of Technology students.">
    <meta name="keywords" content="psg bunker feedback, psg feedback bot, psg tech feedback, psg bunker, psg ecampus feedback">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://psg-bunk.vercel.app/feedback">
    <meta property="og:title" content="PSG Bunker Feedback - Automated Course &amp; Faculty Feedback">
    <meta property="og:description" content="PSG Bunker automated feedback tool for PSG College of Technology students.">
    <meta property="og:image" content="https://psg-bunk.vercel.app/static/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #090a0f;
            --card-bg: rgba(15, 16, 25, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --text: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2rem 1.75rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #64748b;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #94a3b8;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.02em;
            margin-bottom: 1.75rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            height: 46px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0 14px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .input-wrapper input {
            padding-right: 42px;
        }

        input:focus {
            background: rgba(99, 102, 241, 0.06);
            border-color: rgba(99, 102, 241, 0.6);
        }

        .toggle-pw-btn {
            position: absolute;
            right: 10px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 6px;
            font-size: 1rem;
            line-height: 1;
            transition: color 0.2s;
        }

        .toggle-pw-btn:hover {
            color: #cbd5e1;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.25rem;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-submit:active:not(:disabled) {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-box {
            display: none;
            margin-top: 1rem;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.82rem;
            line-height: 1.45;
        }

        .status-box.info {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #c7d2fe;
        }

        .status-box.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            color: #6ee7b7;
        }

        .status-box.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.25);
            color: #fca5a5;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="back-link">← Bunker</a>
    
    <h1>Auto Feedback Bot</h1>

    <form id="feedbackForm">
        <div class="form-group">
            <label for="rollno">Roll No</label>
            <input type="text" id="rollno" placeholder="e.g. 25U201" required autocomplete="username">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="toggle-pw-btn" id="togglePwBtn" title="Toggle visibility">👁️</button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            <span>Submit</span>
        </button>
    </form>

    <div class="status-box" id="statusBox">
        <div id="statusText"></div>
    </div>
</div>

<script>
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const togglePwBtn = document.getElementById('togglePwBtn');
    const pwInput = document.getElementById('password');
    const rollInput = document.getElementById('rollno');

    // Auto-restore saved roll if available
    const savedRoll = localStorage.getItem('bunker_roll') || localStorage.getItem('psg_feedback_rollno');
    if (savedRoll && savedRoll !== 'DEMO') {
        rollInput.value = savedRoll;
    }
    const savedCreds = localStorage.getItem('bunker_credentials');
    if (savedCreds) {
        try {
            const parsed = JSON.parse(savedCreds);
            if (parsed.roll && (!rollInput.value || rollInput.value === parsed.roll)) {
                rollInput.value = parsed.roll;
                if (parsed.password) pwInput.value = parsed.password;
            }
        } catch {}
    }

    togglePwBtn.addEventListener('click', () => {
        const isPw = pwInput.type === 'password';
        pwInput.type = isPw ? 'text' : 'password';
        togglePwBtn.textContent = isPw ? '🔒' : '👁️';
    });

    function showStatus(msg, type = 'info') {
        statusBox.className = 'status-box ' + type;
        statusBox.style.display = 'block';
        statusText.innerHTML = msg;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const rollno = rollInput.value.trim().toUpperCase();
        const password = pwInput.value.trim();

        if (!rollno || !password) {
            showStatus('Roll number and password are required', 'error');
            return;
        }

        localStorage.setItem('psg_feedback_rollno', rollno);

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<div class="spinner"></div><span>Submitting...</span>';
        showStatus('Submitting 5-star feedback in parallel...', 'info');

        const startTime = Date.now();

        try {
            const res = await fetch('/api/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rollno, password, mode: 'auto', rating_style: 'max' })
            });

            const data = await res.json();
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);

            if (res.ok && data.success) {
                showStatus(`🎉 <strong>Success (${elapsed}s)!</strong><br>${data.message || 'Feedback submitted successfully!'}`, 'success');
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 90,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } else {
                showStatus(`❌ <strong>Failed:</strong> ${data.error || 'Server rejected submission'}`, 'error');
            }
        } catch (err) {
            showStatus(`❌ <strong>Error:</strong> ${err.message}`, 'error');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>Submit</span>';
        }
    });
</script>

</body>
</html>
